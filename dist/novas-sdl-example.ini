; Copy settings into user/config/sdl2-config.ini while NovaS is closed.
; This is an example, not an automatically loaded configuration.
; Always write both the value and its \default=false flag.

[Renderer]
backend=1
backend\default=false
vulkan_device=0
vulkan_device\default=false
; 3 = 1x, 6 = 2x, 7 = 3x, 8 = 4x.
resolution_setup=3
resolution_setup\default=false
; 0 = Immediate, 1 = Mailbox, 2 = FIFO, 3 = FIFO relaxed.
use_vsync=2
use_vsync\default=false
; 0 = borderless, 1 = exclusive; use -f to enter fullscreen.
fullscreen_mode=0
fullscreen_mode\default=false
use_disk_shader_cache=true
use_disk_shader_cache\default=false

[System]
; 0 = handheld, 1 = docked.
use_docked_mode=1
use_docked_mode\default=false
; 1 = US English, 5 = Spanish, 14 = Latin American Spanish.
language_index=14
language_index\default=false
; 1 = USA, 2 = Europe.
region_index=1
region_index\default=false
device_name=NovaS
device_name\default=false
current_user=0
current_user\default=false

[Core]
use_multi_core=true
use_multi_core\default=false
use_speed_limit=true
use_speed_limit\default=false
speed_limit=100
speed_limit\default=false

[Controls]
player_0_connected=true
player_0_connected\default=false
; 0 = Pro Controller. SDL bindings are selected automatically for this session.
player_0_type=0
player_0_type\default=false
; Keep Switch Pro controllers on the SDL backend for automatic mapping.
enable_procon_driver=false
enable_procon_driver\default=false
